name: MinecraftAlive
version: '${project.version}'
main: dev.celestia.minecraftalive.MinecraftAlivePlugin
api-version: '1.21'
description: Lets Claude act as a living game master - controlling NPCs, world, and story via an MCP bridge.
author: Celestia
commands:
  malive:
    description: MinecraftAlive admin command
    permission: minecraftalive.admin
    usage: /malive <status|reload>
permissions:
  minecraftalive.admin:
    default: op
